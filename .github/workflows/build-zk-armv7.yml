name: build-zk-armv7

on:
  workflow_dispatch: # Apenas execução manual via botão
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-zk-armv7.yml' # Evita disparar por alterações não relacionadas

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Zig
        uses: mlugg/setup-zig@v1

      - name: Build static armv7 binary
        env:
          CGO_ENABLED: '1'
          GOOS: linux
          GOARCH: arm
          GOARM: '7'
          CC: 'zig cc -target arm-linux-musleabihf'
          CXX: 'zig c++ -target arm-linux-musleabihf'
        run: |
          go build \
            -tags "fts5 netgo osusergo" \
            -ldflags '-linkmode external -extldflags "-static"' \
            -o zk-armv7 .

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zk-armv7
          path: zk-armv7
